<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinner RNG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="header">
    <div class="stat"><span class="stat-label">Money</span><span id="money-display" class="stat-value">$0</span></div>
    <div class="stat"><span class="stat-label">Spins</span><span id="spins-display" class="stat-value">0</span></div>
    <div class="stat"><span class="stat-label">Mult</span><span id="mult-display" class="stat-value">1.00x</span></div>
    <div class="stat"><span class="stat-label">Best</span><span id="best-display" class="stat-value">$0</span></div>
    <div class="stat"><span class="stat-label">Rebirth</span><span id="rebirth-display" class="stat-value">×1</span></div>
    <button id="reset-btn" class="reset-btn">Reset Save</button>
  </header>

  <main id="main">
    <div id="spinner-area">
      <div id="spinner-container">
        <div id="spinner-visual">
          <div id="spinner-rotator">
            <div id="spinner-slices"></div>
            <div id="spinner-ring"></div>
            <div id="spinner-result-label">Wood</div>
          </div>
        </div>
        <div id="rarity-bar">
          <span class="rarity-slot r-common">C <span class="rarity-pct" id="odds-common">60</span>%</span>
          <span class="rarity-slot r-uncommon">U <span class="rarity-pct" id="odds-uncommon">25</span>%</span>
          <span class="rarity-slot r-rare">R <span class="rarity-pct" id="odds-rare">10</span>%</span>
          <span class="rarity-slot r-epic">E <span class="rarity-pct" id="odds-epic">4</span>%</span>
          <span class="rarity-slot r-legendary">L <span class="rarity-pct" id="odds-legendary">1</span>%</span>
        </div>
      </div>
    </div>

    <div id="controls">
      <button id="spin-btn" class="btn btn-primary">SPIN</button>
    </div>

    <div id="action-bar">
      <button id="autospin-btn" class="btn btn-small">Auto-Spin</button>
      <button id="sound-btn" class="btn btn-small">Sound: On</button>
      <button id="streak-display" class="btn btn-small streak-btn">Session: 0</button>
    </div>

    <div id="last-reward" class="reward-display"></div>

    <div id="panels">
      <nav id="panel-tabs">
        <button class="tab-btn active" data-tab="upgrades">Upgrades</button>
        <button class="tab-btn" data-tab="spinners">Spinners</button>
        <button class="tab-btn" data-tab="rebirth">Rebirth</button>
      </nav>
      <div id="panel-upgrades" class="panel active"></div>
      <div id="panel-spinners" class="panel"></div>
      <div id="panel-rebirth" class="panel"></div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
